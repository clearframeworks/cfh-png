name: CFH PNG candidate dependency assessment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 8b48a630ba33cc230cff52cc71454513ef00debc
          persist-credentials: false
      - name: Install OSV Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - name: Audit exact candidate dependencies
        run: |
          "$(go env GOPATH)/bin/osv-scanner" scan source --recursive .